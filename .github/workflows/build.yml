name: build

on:
  push:
    branches: [main]
    paths: ["lists/**", "build/**", ".github/workflows/**"]
  schedule:
    - cron: "0 0 * * *"   # 03:00 MSK
  workflow_dispatch:
    inputs:
      force:
        description: "Publish a release even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Previous release meta
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/release/release/meta.json" -o prev-meta.json \
            || : > prev-meta.json

      - name: Build
        id: build
        run: |
          python build/build.py --out dist --prev prev-meta.json --repo "${{ github.repository }}" \
            ${{ inputs.force && '--force' || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish release branch and tag
        if: steps.build.outputs.release == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          REASON: ${{ steps.build.outputs.reason }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch --depth 1 origin release
            git worktree add rel FETCH_HEAD
            git -C rel checkout -B release
          else
            git worktree add --orphan -b release rel
          fi
          rm -rf rel/release
          mkdir -p rel/release
          cp dist/* rel/release/
          printf '# release branch\n\nGenerated by GitHub Actions from `main`. Do not edit.\nLatest: %s (%s)\n' "$TAG" "$REASON" > rel/README.md
          git -C rel add -A
          git -C rel commit -q -m "release $TAG: $REASON"
          git -C rel tag "$TAG"
          git -C rel push origin release "$TAG"
          gh release create "$TAG" dist/* --title "$TAG" --notes "$REASON"

      # Happ gives up on a geo file after ~30 s; the first request for a new tag on jsDelivr
      # is a cold fetch from GitHub and can be slower. Warm the CDN before anyone else asks.
      - name: Warm jsDelivr cache
        if: steps.build.outputs.release == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
        run: |
          base="https://cdn.jsdelivr.net/gh/${{ github.repository }}@${TAG}/release"
          for f in geosite.dat geoip.dat; do
            ok=0
            for i in $(seq 1 20); do
              res=$(curl -s -o "/tmp/$f" -w '%{http_code} %{time_total}' --max-time 120 "$base/$f" || echo "000 0")
              if [ "${res%% *}" = 200 ] && cmp -s "/tmp/$f" "dist/$f"; then
                echo "$f is on jsDelivr (attempt $i, ${res#* }s)"; ok=1; break
              fi
              echo "$f: HTTP ${res%% *}, content mismatch or not ready (attempt $i), retry in 15s"
              sleep 15
            done
            [ "$ok" = 1 ] || { echo "::error::$f is not available on jsDelivr for $TAG"; exit 1; }
          done
