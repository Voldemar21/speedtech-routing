name: build

on:
  push:
    branches: [main]
    paths: ["lists/**", "build/**", ".github/workflows/**"]
  schedule:
    - cron: "0 0 * * *"   # 03:00 MSK
  workflow_dispatch:
    inputs:
      force:
        description: "Publish a release even if nothing changed"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Previous release meta
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/release/release/meta.json" -o prev-meta.json \
            || : > prev-meta.json

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: false

      - name: Install v2fly/geoip
        run: GOBIN="$PWD/bin" go install github.com/v2fly/geoip@latest

      - name: Build geoip.dat with v2fly/geoip
        run: |
          python build/build.py --prepare-geoip geoip-src
          cd geoip-src && ../bin/geoip -c config.json
          ls -l output/

      - name: Build
        id: build
        run: |
          python build/build.py --out dist --prev prev-meta.json --repo "${{ github.repository }}" \
            --geoip-dat geoip-src/output/geoip.dat ${{ inputs.force && '--force' || '' }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish release branch and tag
        if: steps.build.outputs.release == 'true'
        env:
          TAG: ${{ steps.build.outputs.tag }}
          REASON: ${{ steps.build.outputs.reason }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin release >/dev/null; then
            git fetch --depth 1 origin release
            git worktree add rel FETCH_HEAD
            git -C rel checkout -B release
          else
            git worktree add --orphan -b release rel
          fi
          rm -rf rel/release
          mkdir -p rel/release
          cp dist/* rel/release/
          printf '# release branch\n\nGenerated by GitHub Actions from `main`. Do not edit.\nLatest: %s (%s)\n' "$TAG" "$REASON" > rel/README.md
          git -C rel add -A
          git -C rel commit -q -m "release $TAG: $REASON"
          git -C rel tag "$TAG"
          git -C rel push origin release "$TAG"
          gh release create "$TAG" dist/* --title "$TAG" --notes "$REASON"
